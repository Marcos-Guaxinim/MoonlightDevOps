# ============================================================
# BLOCO REUTILIZÁVEL (YAML Anchor)
# ============================================================
# Isso NÃO cria nenhum serviço.
# Serve apenas para guardar configurações que serão reaproveitadas.
# O "x-" é uma convenção do Docker Compose (extension field).
# O "&db-env" cria um nome (âncora) para esse bloco.
x-db-env: &db-env
  DB_HOST: ${DB_HOST}
  DB_USER: ${DB_USER}
  DB_DATABASE_NAME: ${DB_DATABASE_NAME}
  DB_PASSWORD: ${DB_PASSWORD}

services:
  database:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # Testa se o MySQL está realmente pronto para receber conexões
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [db_network]

  migrate:
    build:
      context: ./Moonlight_Backend
      dockerfile: Dockerfile
      target: migrate
    container_name: migrate_service
    restart: "no"
    # Executa as migrations e, se RUN_SEED=true, também roda o seed
    command: sh -c 'npm run migrate && if [ "$$RUN_SEED" = "true" ]; then npm run seed; fi'
    environment:
      <<: *db-env
      RUN_SEED: ${RUN_SEED:-false} # Padrão = false (só roda seed se for true)
    depends_on:
      database:
        condition: service_healthy # Só começa quando o MySQL estiver saudável
    networks: [db_network]

  backend:
    build:
      context: ./Moonlight_Backend
      dockerfile: Dockerfile
    container_name: backend_service
    restart: unless-stopped
    environment:
      <<: *db-env
      NGROK_URL: ${NGROK_URL}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "3000"
    volumes:
      - uploads-data:/Moonlight_Backend/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully # Só sobe depois que o migrate terminou com sucesso
    networks: [proxy_network, db_network]

  frontend:
    build:
      context: ./Moonlight_Frontend_React
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_USE_MOCK: ${VITE_USE_MOCK}
        VITE_MP_PUBLIC_KEY: ${VITE_MP_PUBLIC_KEY}
    container_name: frontend_service
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - proxy_network

  nginx:
    image: nginx:1.31.1-alpine3.23
    restart: unless-stopped
    container_name: nginx_service
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - proxy_network

networks:
  proxy_network:
    driver: bridge
  db_network:
    driver: bridge

volumes:
  db-data:
  uploads-data:
